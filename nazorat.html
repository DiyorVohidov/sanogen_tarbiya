<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiqa Fani Test Platformasi</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --bg: #F4F7F6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            text-align: center;
        }

        h1 { color: #2C3E50; margin-bottom: 25px; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #357ABD;
        }

        .btn-restart {
            background-color: #7F8C8D;
            margin-top: 20px;
        }

        .quiz-box { display: none; text-align: left; }

        .question {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #34495E;
        }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option-btn {
            background: #EDF2F7;
            border: 2px solid #CBD5E0;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #E2E8F0;
            border-color: #A0AEC0;
        }

        .result-box { display: none; }

        .result-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .score-text { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>🎵 Musiqa Fani Test Platformasi</h1>
        <p>Sinfni tanlang va bilimingizni sinab ko'ring:</p>
        <div class="btn-group">
            <button class="btn" onclick="startQuiz(2)">2-Sinf</button>
            <button class="btn" onclick="startQuiz(3)">3-Sinf</button>
            <button class="btn" onclick="startQuiz(4)">4-Sinf</button>
        </div>
    </div>

    <div id="quiz-box" class="quiz-box">
        <h2 id="quiz-title"></h2>
        <div id="progress" style="margin-bottom: 15px; font-weight: bold; color: #7F8C8D;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-box" class="result-box">
        <h2>Natija</h2>
        <div id="result-message" class="score-text"></div>
        <div id="result-image-container"></div>
        <button class="btn btn-restart" onclick="resetQuiz()">Bosh sahifaga qaytish</button>
    </div>
</div>

<script>
const tests = {
    2: [
        { q: "1. Nota chizig'i nechta parallel chiziqdan iborat?", a: ["2 ta", "3 ta", "4 ta", "5 ta"], correct: 3 },
        { q: "2. Tovushqator deb nimaga aytiladi?", a: ["Tovushlar balandligi o'sishi yoki kamayishiga", "Tovushlar balandligi o'sishiga", "Tovushlar balandligi kamayishiga", "Tovushlar bo'lmaydi"], correct: 0 },
        { q: "3. Bir oktava oraliq masofasida nechta nota mavjud?", a: ["7", "8", "9", "10"], correct: 0 },
        { q: "4. Qo'shiq nima?", a: ["Tovush harakati", "Musiqiy janr", "Keng ma'noda ashula", "Keng ma'noda she'riy-musiqiy janr"], correct: 3 }
    ],
    3: [
        { q: "1. Tinchlik timsoli deb nima ko'riladi?", a: ["Humo qushi", "Kabutar", "Laylak", "Oqqush"], correct: 1 },
        { q: "2. V.A.Motsart qachon tug'ilgan?", a: ["1756 yil", "1755 yil", "1765 yil", "1745 yil"], correct: 0 },
        { q: "3. Ovoz yozish studiyasining eng muhim jihozi nima?", a: ["Quloqchin", "Pult", "Mikrafon", "Akustik karnay"], correct: 2 }
    ],
    4: [
        { q: "1. Musiqada nechta nota bor?", a: ["8", "7", "5", "6"], correct: 1 },
        { q: "2. Damli cholg'ularga qaysilar kiradi?", a: ["nay", "rubob", "doira", "dutor"], correct: 0 },
        { q: "3. 'Aka-singil' qo'shig'ining muallifi kim?", a: ["X.Hasanova", "D.Omonullayeva", "Bolalar qo'shig'i", "Sh.Yormatov"], correct: 0 }
    ]
};

let currentClass = 2;
let currentQuestionIndex = 0;
let score = 0;

function startQuiz(grade) {
    currentClass = grade;
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('quiz-title').innerText = grade + "-Sinf Musiqa Testi";
    
    showQuestion();
}

function showQuestion() {
    const qList = tests[currentClass];
    if (currentQuestionIndex >= qList.length) {
        finishQuiz();
        return;
    }
    
    const q = qList[currentQuestionIndex];
    document.getElementById('progress').innerText = `Savol ${currentQuestionIndex + 1} / ${qList.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    q.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(index) {
    if (index === tests[currentClass][currentQuestionIndex].correct) {
        score++;
    }
    currentQuestionIndex++;
    showQuestion();
}

function finishQuiz() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    
    const total = tests[currentClass].length;
    const mistakes = total - score;
    const msg = document.getElementById('result-message');
    const imgContainer = document.getElementById('result-image-container');
    
    if (mistakes === 0) {
        msg.innerHTML = `<span class="text-success">Barakalla! 100% natija (${score}/${total})!</span>`;
        imgContainer.innerHTML = `<img src="alochi.jpg" alt="Eng a'lochi o'quvchi" class="result-img">`;
    } else if (mistakes <= 2) {
        msg.innerHTML = `<span class="text-warning">Juda yaxshi! Siz ${mistakes} ta xato qildingiz (${score}/${total}).</span>`;
        imgContainer.innerHTML = `<img src="bilimdon.jpg" alt="Eng bilimdon o'quvchi" class="result-img">`;
    } else {
        msg.innerHTML = `<span class="text-danger">Mavzuni qaytadan o'zlashtiring! Xatolar soni: ${mistakes} ta (${score}/${total}).</span>`;
        imgContainer.innerHTML = `<p style="font-size: 18px; color: #7F8C8D; margin: 20px 0;">Yana bir bor urinib ko'ring va bilimingizni oshiring!</p>`;
    }
}

function resetQuiz() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('main-menu').style.display = 'block';
}
</script>
</body>
</html>

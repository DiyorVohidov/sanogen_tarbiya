<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiqa Fani Test Platformasi</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --warning: #F39C12;
            --danger: #E74C3C;
            --bg: #F4F7F6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 750px;
            text-align: center;
        }

        h1 { color: #2C3E50; margin-bottom: 25px; }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            background-color: #357ABD;
        }

        .btn-restart {
            background-color: #7F8C8D;
            margin-top: 20px;
        }

        .quiz-box { display: none; text-align: left; }

        .question {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #34495E;
        }

        .options { display: flex; flex-direction: column; gap: 10px; }

        .option-btn {
            background: #EDF2F7;
            border: 2px solid #CBD5E0;
            padding: 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .option-btn:hover {
            background: #E2E8F0;
            border-color: #A0AEC0;
        }

        .result-box { display: none; }

        .result-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .score-text { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
    </style>
</head>
<body>

<div class="container">
    <div id="main-menu">
        <h1>🎵 Musiqa Fani Test Platformasi</h1>
        <p>Sinfni tanlang va bilimingizni sinab ko'ring:</p>
        <div class="btn-group">
            <button class="btn" onclick="startQuiz(2)">2-Sinf</button>
            <button class="btn" onclick="startQuiz(3)">3-Sinf</button>
            <button class="btn" onclick="startQuiz(4)">4-Sinf</button>
            <a href="index.html" style="
                background-color: #4f46e5;
                color: white;
                padding: 20px 20px;
                border-radius: 20px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;">
                🏠 Bosh sahifaga o'tish
            </a>
        </div>
    </div>

    <div id="quiz-box" class="quiz-box">
        <h2 id="quiz-title"></h2>
        <div id="progress" style="margin-bottom: 15px; font-weight: bold; color: #7F8C8D;"></div>
        <div class="question" id="question-text"></div>
        <div class="options" id="options-container"></div>
    </div>

    <div id="result-box" class="result-box">
        <h2>Natija</h2>
        <div id="result-message" class="score-text"></div>
        <div id="result-image-container"></div>
        <button class="btn btn-restart" onclick="resetQuiz()">Bosh sahifaga qaytish</button>
    </div>
</div>

<script>
const tests = {
    2: [
        { q: "1. Nota chizig'i nechta parallel chiziqdan iborat?", a: ["2 ta", "3 ta", "4 ta", "5 ta"], correct: 3 },
        { q: "2. Tovushqator deb nimaga aytiladi?", a: ["Tovushlar balandligi o'sishi yoki kamayishiga", "Tovushlar balandligi o'sishiga", "Tovushlar balandligi kamayishiga", "Tovushlar bo'lmaydi"], correct: 0 },
        { q: "3. Tovush qator notasi deb nimaga aytiladi?", a: ["Barcha notaga", "Faqat do notasiga", "Har bir notaga", "Do notasidan do notagacha"], correct: 3 },
        { q: "4. Oktava deb nimaga aytiladi?", a: ["Bir xil nomdagi nota orasiga", "Dodan dogacha", "Oktavalar bo'lmaydi", "Har bir notaga"], correct: 0 },
        { q: "5. Bir oktava oraliq masofasida nechta nota mavjud?", a: ["7", "8", "9", "10"], correct: 0 },
        { q: "6. Har bir oktavalarni o'z nomi bormi?", a: ["Yo'q", "Ha"], correct: 1 },
        { q: "7. Yomg'ir yog'aloq yam-yashil o'tloq. Bu qaysi qo'shiqdan olingan?", a: ["Yomg'ir yog'aloq", "Yomg'irlar", "Ona Vatan", "Vatan"], correct: 0 },
        { q: "8. Harbiy orkestr nima?", a: ["Ichki ishlar hodimlari", "Musiqachilar guruhi", "Harbiylar jamoasi", "Harbiy musiqachilar guruhi"], correct: 3 },
        { q: "9. Harbiy orkestrlar qanday paytda ijro qiladi?", a: ["Faqatgina bayramlar", "Marosim va tantanalar", "Tantanali tadbirlar va konsertlar", "To'y marosimlari"], correct: 1 },
        { q: "10. Qo'shiq nima?", a: ["Tovush harakati", "Musiqiy janr", "Keng ma'noda ashula", "Keng ma'noda she'riy-musiqiy janr"], correct: 3 },
        { q: "11. Yarim nota sanog'i nechaga teng?", a: ["1i", "1i, 2i", "1i, 2i, 3i, 4i", "1 yoki I ga"], correct: 1 },
        { q: "12. Butun nota sanog'i nechaga teng?", a: ["1i", "1i, 2i", "1i, 2i, 3i", "1i, 2i, 3i, 4i"], correct: 3 },
        { q: "13. Tabiatda necha xil tovushlar bor?", a: ["3 xil", "2 xil", "7 xil", "8 xil"], correct: 1 },
        { q: "14. Bog'da arilar Gullarga qo'nar. Bu qaysi qo'shiqdan olingan?", a: ["Bolalik", "O'ynaylik", "O'ynaymiz", "Yomg'ir yog'aloq"], correct: 2 }
    ],
    3: [
        { q: "1. IV-chorakda o'tilgan 1-mavzu nomi nima?", a: ["Mening do'stlarim", "Bremen mashshoqlari", "Tinchlik bo'lsin", "Mehribonim onajon"], correct: 2 },
        { q: "2. Muzqaymoq qo'shig'ining mualliflari kim?", a: ["A.Oripov, M.Burxonov", "P.Mo'min, Sh.Yormatov", "K.Turdiyeva, J.Abdurahmonov", "X.Qayumov, A.Mansurov"], correct: 1 },
        { q: "3. Tinchlik timsoli deb nima ko'riladi?", a: ["Humo qushi", "Kabutar", "Laylak", "Oqqush"], correct: 1 },
        { q: "4. Tinchlik bo'lsin qo'shig'i mualliflari kim?", a: ["H.Ahmedova, X.Hasanova", "P.Mo'min, A.Mansurov", "K.Turdiyeva, H.Rahimov", "A.Oripov, D.Omonullayeva"], correct: 1 },
        { q: "5. Ovoz yozish studiyasining eng muhim jihozi nima?", a: ["Quloqchin", "Pult", "Mikrafon", "Akustik karnay"], correct: 2 },
        { q: "6. Tovushli signallarni boshqalarga halaqit qilmasdan tinglash qurilmasi?", a: ["Quloqchin", "Pult", "Miksher", "Muhandis"], correct: 0 },
        { q: "7. Yozib olingan ovozni mukammal sifatga aylantiradigan mutaxassis kim?", a: ["Ovoz rejissori", "Mutaxassis", "Pult", "Miksher"], correct: 0 },
        { q: "8. Ovoz uskunalarini tanlaydigan, o'rnatadigan, sozlaydigan mutaxassis?", a: ["Ovoz rejissori", "Pult", "Ovoz muhandisi", "Sozlovchi"], correct: 2 },
        { q: "9. V.A.Motsart qachon tug'ilgan?", a: ["1756 yil", "1755 yil", "1765 yil", "1745 yil"], correct: 0 },
        { q: "10. Motsart necha yoshida kichik peysalar yoza boshlagan?", a: ["8 yoshida", "6 yoshida", "3 yoshida", "10 yoshida"], correct: 1 },
        { q: "11. Qovoqarining parvozi kimning qalamiga mansub?", a: ["Nikolay Rimskiy-Korsakov", "Piyotr Ilich Chaykovskiy", "Mixayil Ivanovich Glinka", "Borodin"], correct: 0 },
        { q: "12. Shoh Saltan va oqqush ertagidagi birinchi mo'jiza nima edi?", a: ["Malika", "33 pahlavon", "Olmaxon", "Oqqush"], correct: 3 },
        { q: "13. Shoh Saltan va oqqush ertagidagi uchinchi mo'jiza nima edi?", a: ["Malika", "Oqqush malika", "Olmaxon", "33 pahlavon"], correct: 3 },
        { q: "14. Shoh Saltan ertagi kimning qalamiga mansub?", a: ["Glinka", "Rimskiy-Korsakov", "Pushkin", "Chaykovskiy"], correct: 2 },
        { q: "15. Qaldirg'ochlar qanotida, Dunyoga baxt olib kelsin. Bu qaysi qo'shiqdan olingan?", a: ["Yulduzlar", "Shirin-Shirin", "Tinchlik bo'lsin", "Qadirdon maktab"], correct: 2 }
    ],
    4: [
        { q: "1. Musiqada nechta nota bor?", a: ["8", "7", "5", "6"], correct: 1 },
        { q: "2. Damli cholg'ularga qaysilar kiradi?", a: ["nay", "rubob", "doira", "dutor"], correct: 0 },
        { q: "3. Nota nima? Qulog'imiz bilan xis qiladigan jarayon B) Jarangli va jarangsiz", a: ["Musiqa alifbosi", "Tovush", "Ovoz", "Notalar majmui"], correct: 0 },
        { q: "4. Musiqada asosan nechta kalit bor?", a: ["8", "7", "10", "2"], correct: 1 },
        { q: "5. Jim turish belgilari qaysi?", a: ["pauza", "lida", "o'lchov", "temp"], correct: 0 },
        { q: "6. Nay qanday chalinadi?", a: ["Pyflab chalinadi", "Urib chalinadi", "Chertib chalinadi", "Qo'shib chalinadi"], correct: 0 },
        { q: "7. Mayin, yumshoq, mungli qo'shiqlar qaysi ladda, tovushqatorda yaratiladi?", a: ["Hamma ladda", "Minor ladida", "Major ladida", "O'rta ladda"], correct: 1 },
        { q: "8. Madhiyani qaysi shoir yozgan?", a: ["A.Oripov", "P.Mo'min", "I.Muslin", "Sh.Yormatov"], correct: 0 },
        { q: "9. Musiqada kayfiyat nima deyiladi?", a: ["Lad va bu", "Ritm c) Temp", "Ohang / Lad", "Dinamika"], correct: 0 },
        { q: "10. 'Aka-singil' qo'shig'ining muallifi kim?", a: ["X.Hasanova", "D.Omonullayeva", "Bolalar qo'shig'i", "Sh.Yormatov"], correct: 0 }
    ]
};

let currentClass = 2;
let currentQuestionIndex = 0;
let score = 0;

function startQuiz(grade) {
    currentClass = grade;
    currentQuestionIndex = 0;
    score = 0;
    
    document.getElementById('main-menu').style.display = 'none';
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('quiz-title').innerText = grade + "-Sinf Musiqa Testi";
    
    showQuestion();
}

function showQuestion() {
    const qList = tests[currentClass];
    if (currentQuestionIndex >= qList.length) {
        finishQuiz();
        return;
    }
    
    const q = qList[currentQuestionIndex];
    document.getElementById('progress').innerText = `Savol ${currentQuestionIndex + 1} / ${qList.length}`;
    document.getElementById('question-text').innerText = q.q;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    q.a.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt;
        btn.onclick = () => selectAnswer(idx);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(index) {
    if (index === tests[currentClass][currentQuestionIndex].correct) {
        score++;
    }
    currentQuestionIndex++;
    showQuestion();
}

function finishQuiz() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    
    const total = tests[currentClass].length;
    const mistakes = total - score;
    const msg = document.getElementById('result-message');
    const imgContainer = document.getElementById('result-image-container');
    
    if (mistakes === 0) {
        msg.innerHTML = `<span class="text-success">Barakalla! 100% natija (${score}/${total})!</span>`;
        imgContainer.innerHTML = `<img src="alochi.jpg" alt="Eng a'lochi o'quvchi" class="result-img">`;
    } else if (mistakes <= 2) {
        msg.innerHTML = `<span class="text-warning">Juda yaxshi! Siz ${mistakes} ta xato qildingiz (${score}/${total}).</span>`;
        imgContainer.innerHTML = `<img src="bilimdon.jpg" alt="Eng bilimdon o'quvchi" class="result-img">`;
    } else {
        msg.innerHTML = `<span class="text-danger">Mavzuni qaytadan o'zlashtiring! Xatolar soni: ${mistakes} ta (${score}/${total}).</span>`;
        imgContainer.innerHTML = `<p style="font-size: 18px; color: #7F8C8D; margin: 20px 0;">Yana bir bor urinib ko'ring va bilimingizni oshiring!</p>`;
    }
}

function resetQuiz() {
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('main-menu').style.display = 'block';
}
</script>
</body>
</html>

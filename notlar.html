<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiv Notalar Platformasi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }

        /* Note bounce and animation effects */
        .note-element {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
            cursor: pointer;
        }

        .note-element:hover {
            transform: scale(1.15) translateY(-4px);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.15));
        }

        .note-element:active, .note-active {
            transform: scale(1.25) translateY(-8px) !important;
            filter: drop-shadow(0 14px 20px rgba(0,0,0,0.25)) !important;
        }

        /* Continuous subtle float animation for notes */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-8">

    <!-- Header / Nav -->
    <header class="max-w-5xl mx-auto w-full text-center mb-6">
        <div class="inline-flex items-center gap-3 bg-white px-6 py-2 rounded-full shadow-md mb-3 border border-sky-100">
            <span class="text-2xl">🎵</span>
            <h1 class="text-2xl sm:text-3xl font-bold bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 bg-clip-text text-transparent">
                Musiqa Notalari 
            </h1>
        </div>
        <p class="text-slate-600 text-sm sm:text-base font-medium max-w-lg mx-auto">
            Notaning ustiga bosing yoki klaviaturadan foydalanib notalar ovozini tinglang va o'rganing!
        </p>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto w-full bg-white rounded-3xl shadow-xl p-4 sm:p-8 border border-slate-100 flex flex-col gap-6">

        <!-- Controls Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4">
            <!-- Mode Switch / Buttons -->
            <div class="flex flex-wrap items-center gap-3">
                <button id="btn-play-song" onclick="playMelody()" class="px-5 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-semibold rounded-2xl shadow-lg shadow-teal-500/30 active:scale-95 transition flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Kichik Kuyni Ijro Etish</span>
                </button>
                <button id="btn-stop" onclick="stopMelody()" class="hidden px-4 py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-semibold rounded-2xl shadow transition">
                    To'xtatish ⏹️
                </button>
            <a href="index.html" style="
                background-color: #4f46e5;
                color: white;
                padding: 10px 20px;
                border-radius: 20px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;">
                🏠 Bosh sahifaga o'tish
            </a>
            </div>

            <!-- Waveform selector for Sound -->
            <div class="flex items-center gap-2 bg-slate-50 p-1.5 rounded-2xl border border-slate-200">
                <span class="text-xs font-semibold text-slate-500 px-2">Ovoz turi:</span>
                <button onclick="setWaveform('sine')" id="wave-sine" class="wave-btn px-3 py-1 rounded-xl text-xs font-bold bg-white text-indigo-600 shadow">Mayin (Sine)</button>
                <button onclick="setWaveform('triangle')" id="wave-triangle" class="wave-btn px-3 py-1 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900">Yorqin (Triangle)</button>
                <button onclick="setWaveform('bounce')" id="wave-bounce" class="wave-btn px-3 py-1 rounded-xl text-xs font-bold text-slate-600 hover:text-slate-900">Qiziqarli (Marimba)</button>
            </div>
        </div>

        <!-- Musical Staff Display (SVG) -->
        <div class="relative w-full overflow-x-auto py-4 flex justify-center bg-slate-50/50 rounded-2xl border border-slate-100">
            <svg id="music-staff" viewBox="0 0 900 480" class="w-full min-w-[750px] max-w-[900px] h-auto select-none">
                
                <!-- Background Texture / Paper feel -->
                <rect width="900" height="480" fill="#fafafa" rx="16"/>

                <!-- Staff Line Numbers (1 to 5 from bottom up) -->
                <!-- Line 5 -->
                <text x="35" y="125" font-size="28" font-weight="bold" fill="#334155" text-anchor="end">5</text>
                <!-- Line 4 -->
                <text x="35" y="185" font-size="28" font-weight="bold" fill="#334155" text-anchor="end">4</text>
                <!-- Line 3 -->
                <text x="35" y="245" font-size="28" font-weight="bold" fill="#334155" text-anchor="end">3</text>
                <!-- Line 2 -->
                <text x="35" y="305" font-size="28" font-weight="bold" fill="#334155" text-anchor="end">2</text>
                <!-- Line 1 -->
                <text x="35" y="365" font-size="28" font-weight="bold" fill="#334155" text-anchor="end">1</text>

                <!-- 5 Main Lines of the Musical Staff -->
                <!-- Line 5 (Top) -->
                <line x1="60" y1="120" x2="860" y2="120" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
                <!-- Line 4 -->
                <line x1="60" y1="180" x2="860" y2="180" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
                <!-- Line 3 -->
                <line x1="60" y1="240" x2="860" y2="240" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
                <!-- Line 2 -->
                <line x1="60" y1="300" x2="860" y2="300" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
                <!-- Line 1 (Bottom) -->
                <line x1="60" y1="360" x2="860" y2="360" stroke="#000000" stroke-width="3" stroke-linecap="round"/>

                <!-- Ledger line for DO (below line 1) -->
                <line x1="90" y1="420" x2="160" y2="420" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>

                <!-- Dynamic elements inserted via JavaScript -->
                <g id="notes-group"></g>
            </svg>
        </div>

        <!-- Interactive Keyboard Shortcuts / Note Pad -->
        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
            <!-- Buttons generated dynamically -->
        </div>

        <!-- Help & Instructions -->
        <div class="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 flex items-center justify-between text-indigo-900 text-sm">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⌨️</span>
                <div>
                    <span class="font-bold">Klaviatura orqali chaling:</span>
                    <span class="ml-1 text-indigo-700">Tugmalar: <code class="bg-white px-2 py-0.5 rounded border border-indigo-200 font-mono font-bold">1-7</code> yoki <code class="bg-white px-2 py-0.5 rounded border border-indigo-200 font-mono font-bold">A S D F G H J</code></span>
                </div>
            </div>
            <span class="hidden md:inline text-xs bg-indigo-200/60 px-3 py-1 rounded-full text-indigo-800 font-semibold">Tugmani bosing!</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="max-w-5xl mx-auto w-full text-center mt-6 text-xs text-slate-400">
        Interaktiv Musiqa Ta'limi Platformasi &copy; 2026
    </footer>

    <!-- Audio Synthesis and Interactive Script -->
    <script>
        // Web Audio Context setup
        let audioCtx = null;
        let currentWaveform = 'sine';
        let melodyTimeout = null;

        // Note data strictly structured according to images and pitch
        const notesData = [
            {
                id: 'do',
                name: 'DO',
                fullName: 'DO notasi',
                freq: 261.63, // C4
                color: '#ff4d4d', // Bright Red
                textColor: '#e60000',
                x: 125,
                y: 420, // Ledger line below staff line 1
                stemUp: true,
                key: '1',
                keyAlt: 'a'
            },
            {
                id: 're',
                name: 'RE',
                fullName: 'RE notasi',
                freq: 293.66, // D4
                color: '#ff944d', // Bright Orange
                textColor: '#e65c00',
                x: 235,
                y: 390, // Under staff line 1
                stemUp: true,
                key: '2',
                keyAlt: 's'
            },
            {
                id: 'mi',
                name: 'MI',
                fullName: 'MI notasi',
                freq: 329.63, // E4
                color: '#ffcc00', // Yellow
                textColor: '#d6a100',
                x: 345,
                y: 360, // On staff line 1
                stemUp: true,
                key: '3',
                keyAlt: 'd'
            },
            {
                id: 'fa',
                name: 'FA',
                fullName: 'FA notasi',
                freq: 349.23, // F4
                color: '#88e000', // Lime Green
                textColor: '#68ad00',
                x: 455,
                y: 330, // In space 1
                stemUp: true,
                key: '4',
                keyAlt: 'f'
            },
            {
                id: 'sol',
                name: 'SOL',
                fullName: 'SOL notasi',
                freq: 392.00, // G4
                color: '#55c5ff', // Light Blue
                textColor: '#009bf0',
                x: 565,
                y: 300, // On staff line 2
                stemUp: true,
                key: '5',
                keyAlt: 'g'
            },
            {
                id: 'lya',
                name: 'LYA',
                fullName: 'LYA notasi',
                freq: 440.00, // A4
                color: '#b39ddb', // Soft Purple
                textColor: '#7e57c2',
                x: 675,
                y: 270, // In space 2
                stemUp: true,
                key: '6',
                keyAlt: 'h'
            },
            {
                id: 'si',
                name: 'SI',
                fullName: 'SI notasi',
                freq: 493.88, // B4
                color: '#c084fc', // Violet
                textColor: '#9333ea',
                x: 785,
                y: 240, // On staff line 3
                stemUp: true,
                key: '7',
                keyAlt: 'j'
            }
        ];

        // Initialize Audio Context on user interaction
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Change synth waveform type
        function setWaveform(type) {
            currentWaveform = type;
            document.querySelectorAll('.wave-btn').forEach(btn => {
                btn.classList.remove('bg-white', 'text-indigo-600', 'shadow');
                btn.classList.add('text-slate-600');
            });
            const activeBtn = document.getElementById(`wave-${type}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white', 'text-indigo-600', 'shadow');
                activeBtn.classList.remove('text-slate-600');
            }
        }

        // Play note audio frequency using Web Audio API synth
        function playSound(freq) {
            initAudio();
            const now = audioCtx.currentTime;

            if (currentWaveform === 'bounce') {
                // Marimba / Bell synth style
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                
                // Add quick harmonic overtones
                const osc2 = audioCtx.createOscillator();
                const gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(freq * 2, now);

                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                gain2.gain.setValueAtTime(0.2, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);

                osc.connect(gain);
                osc2.connect(gain2);
                gain.connect(audioCtx.destination);
                gain2.connect(audioCtx.destination);

                osc.start(now);
                osc2.start(now);
                osc.stop(now + 1.2);
                osc2.stop(now + 0.4);
            } else {
                // Standard Sine or Triangle wave
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = currentWaveform;
                osc.frequency.setValueAtTime(freq, now);

                // Smooth envelope (attack, decay)
                gain.gain.setValueAtTime(0, now);
                gain.gain.linearRampToValueAtTime(0.5, now + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 1.0);
            }
        }

        // Trigger Note Interaction (Sound + Animation)
        function triggerNote(noteId) {
            const note = notesData.find(n => n.id === noteId);
            if (!note) return;

            // Play Sound
            playSound(note.freq);

            // Visual feedback on SVG note element
            const svgGroup = document.getElementById(`svg-note-${note.id}`);
            if (svgGroup) {
                svgGroup.classList.add('note-active');
                setTimeout(() => {
                    svgGroup.classList.remove('note-active');
                }, 300);
            }

            // Visual feedback on bottom key card
            const keyCard = document.getElementById(`key-card-${note.id}`);
            if (keyCard) {
                keyCard.classList.add('ring-4', 'ring-offset-2', 'ring-indigo-400', 'scale-105');
                setTimeout(() => {
                    keyCard.classList.remove('ring-4', 'ring-offset-2', 'ring-indigo-400', 'scale-105');
                }, 300);
            }
        }

        // Render Musical Staff Notes as SVGs
        function renderNotes() {
            const container = document.getElementById('notes-group');
            let html = '';

            notesData.forEach((note) => {
                // Stem calculation (goes up or down based on standard notation)
                const stemHeight = 100;
                const stemX = note.x + 22;
                const stemY1 = note.y - 6;
                const stemY2 = note.y - stemHeight;

                html += `
                    <g id="svg-note-${note.id}" class="note-element" onclick="triggerNote('${note.id}')">
                        <!-- Label Title Above Note (Matches Images style e.g., 'DO notasi') -->
                        <text x="${note.x}" y="70" font-size="28" font-weight="800" fill="${note.textColor}" text-anchor="middle">
                            ${note.name}
                        </text>
                        <text x="${note.x}" y="102" font-size="22" font-weight="700" fill="${note.textColor}" text-anchor="middle">
                            notasi
                        </text>

                        <!-- Vertical Stem -->
                        <line x1="${stemX}" y1="${stemY1}" x2="${stemX}" y2="${stemY2}" stroke="${note.color}" stroke-width="7" stroke-linecap="round"/>

                        <!-- Note Head Oval -->
                        <g transform="translate(${note.x}, ${note.y}) rotate(-18)">
                            <ellipse cx="0" cy="0" rx="26" ry="19" fill="${note.color}"/>
                            
                            <!-- Cute Face (Eyes and Smile) -->
                            <!-- Left Eye -->
                            <circle cx="-9" cy="-3" r="3" fill="#1e293b"/>
                            <!-- Right Eye -->
                            <circle cx="9" cy="-3" r="3" fill="#1e293b"/>
                            <!-- Smile Mouth -->
                            <path d="M -7 4 Q 0 12 7 4" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round"/>
                        </g>
                    </g>
                `;
            });

            container.innerHTML = html;
        }

        // Render Keyboard Shortcut Cards below the staff
        function renderKeyCards() {
            const container = document.querySelector('.grid');
            let html = '';

            notesData.forEach(note => {
                html += `
                    <button id="key-card-${note.id}" onclick="triggerNote('${note.id}')"
                        class="flex flex-col items-center justify-between p-3 rounded-2xl border-2 transition-all shadow-sm hover:shadow-md bg-white"
                        style="border-color: ${note.color};">
                        <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Tugma: ${note.key} / ${note.keyAlt.toUpperCase()}</span>
                        <div class="w-10 h-10 my-1 rounded-full flex items-center justify-center font-black text-white text-lg shadow-sm" style="background-color: ${note.color};">
                            ${note.name}
                        </div>
                        <span class="text-xs font-medium" style="color: ${note.textColor}">${note.fullName}</span>
                    </button>
                `;
            });

            container.innerHTML = html;
        }

        // Auto-Play Nursery Melody ("Do Re Mi Fa Sol...")
        function playMelody() {
            stopMelody();
            const btnPlay = document.getElementById('btn-play-song');
            const btnStop = document.getElementById('btn-stop');
            btnPlay.classList.add('hidden');
            btnStop.classList.remove('hidden');

            // Simple ascending & descending scale melody
            const sequence = [
                { id: 'do', duration: 400 },
                { id: 're', duration: 400 },
                { id: 'mi', duration: 400 },
                { id: 'fa', duration: 400 },
                { id: 'sol', duration: 400 },
                { id: 'lya', duration: 400 },
                { id: 'si', duration: 500 },
                { id: 'si', duration: 300 },
                { id: 'lya', duration: 300 },
                { id: 'sol', duration: 300 },
                { id: 'fa', duration: 300 },
                { id: 'mi', duration: 300 },
                { id: 're', duration: 300 },
                { id: 'do', duration: 600 }
            ];

            let index = 0;

            function playNext() {
                if (index >= sequence.length) {
                    stopMelody();
                    return;
                }
                const item = sequence[index];
                triggerNote(item.id);
                index++;
                melodyTimeout = setTimeout(playNext, item.duration);
            }

            playNext();
        }

        // Stop auto-play melody
        function stopMelody() {
            if (melodyTimeout) {
                clearTimeout(melodyTimeout);
                melodyTimeout = null;
            }
            const btnPlay = document.getElementById('btn-play-song');
            const btnStop = document.getElementById('btn-stop');
            if (btnPlay && btnStop) {
                btnPlay.classList.remove('hidden');
                btnStop.classList.add('hidden');
            }
        }

        // Event Listener for Keyboard Key Presses
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return; // Prevent continuous triggers on hold
            const pressedKey = e.key.toLowerCase();
            const note = notesData.find(n => n.key === pressedKey || n.keyAlt === pressedKey);
            if (note) {
                triggerNote(note.id);
            }
        });

        // Initialize page elements on load
        window.onload = function() {
            renderNotes();
            renderKeyCards();
        };
    </script>
</body>
</html>
